name: 生成具身智能中文日报

on:
  schedule:
    # UTC 22:00 约等于北京时间 06:00。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 生成日报
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_RSS_FEEDS: ${{ vars.NEWS_RSS_FEEDS }}
        run: python scripts/render_report.py

      - name: 提交日报和小程序文章数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/raw data/processed miniprogram_export miniprogram
          if git diff --cached --quiet; then
            echo "没有新的日报变更。"
          else
            git commit -m "生成具身智能中文日报和小程序文章数据 $(date +'%Y-%m-%d')"
            git push
          fi
