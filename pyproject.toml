[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-daily"
version = "0.1.0"
description = "具身智能中文日报自动化系统 MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.40.0",
  "requests>=2.32.0",
  "feedparser>=6.0.11",
  "arxiv>=2.1.3",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "pandas>=2.2.0",
  "jinja2>=3.1.4",
  "python-dateutil>=2.9.0",
  "rapidfuzz>=3.9.0",
]

[project.scripts]
embodied-ai-daily = "scripts.render_report:main"

[tool.setuptools]
packages = ["scripts"]
